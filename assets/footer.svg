<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Fin de session — merci d'être passé">
<title>Fin de session — merci d'être passé</title>

<style>
  text{font-family:'JetBrains Mono','Fira Code','SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;white-space:pre}
  .in{animation:in .55s ease both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fade{animation:fade .8s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .cur{animation:cur 1.05s steps(1) infinite}
  @keyframes cur{50%{fill-opacity:0}}
  .led{animation:led 2.4s ease-in-out infinite}
  @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
  .draw{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.6,0,.2,1) both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .type{transform-box:fill-box;transform-origin:0 0;animation:type 1s steps(12,end) both}
  @keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite}
  @keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.8);opacity:0}}
  .sweep{animation:sweep 8s linear infinite}
  @keyframes sweep{from{transform:translateY(-140px)}to{transform:translateY(560px)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .breath{animation:breath 6s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.13}50%{opacity:.22}}
  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 1.1s ease-in-out infinite alternate}
  @keyframes bar{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#fff" opacity=".028"/></pattern>
  <linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFB000" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFB000" stop-opacity=".055"/>
    <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="moon" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#FFB000" stop-opacity="1"/>
    <stop offset=".7" stop-color="#FFB000" stop-opacity=".55"/>
    <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect x="1" y="1" width="898" height="208" rx="16"/></clipPath>
</defs>


<rect x="1" y="1" width="898" height="208" rx="16" fill="#0B0D10" stroke="#232A34" stroke-width="2"/>
<circle cx="26" cy="21" r="6" fill="#FF5F57"/>
<circle cx="46" cy="21" r="6" fill="#FFB000"/>
<circle cx="66" cy="21" r="6" fill="#3DDC84"/>
<text x="450" y="26" text-anchor="middle" font-size="13" fill="#6B7685">heron@homelab — fin de session</text>
<line x1="2" y1="42" x2="898" y2="42" stroke="#232A34" stroke-width="1.5"/>
<text class="in" style="animation-delay:0.20s" x="36" y="82" font-size="15"><tspan fill="#5EEAD4">heron@homelab</tspan><tspan fill="#6B7685">:~$ </tspan><tspan fill="#E6EAF0">exit</tspan></text>
<text class="in" style="animation-delay:0.70s" x="36" y="108" font-size="13" fill="#6B7685">déconnexion de github.com/loan-heron…</text>
<text class="in" style="animation-delay:1.20s" x="36" y="150" font-size="24" font-weight="700" fill="#FFB000">Merci d'être passé. À bientôt.<tspan class="cur" fill="#FFB000"> █</tspan></text>
<text class="fade" style="animation-delay:1.60s" x="36" y="182" font-size="12" fill="#6B7685">© 2026 Loan Heron · README fait main, 100 % SVG animé</text>
<circle class="breath" cx="788" cy="118" r="62" fill="url(#moon)"/>
<g transform="translate(726 54) scale(.95)">
  <line x1="16" y1="130" x2="132" y2="130" stroke="#232A34" stroke-width="1.5"/>
  <rect x="27" y="6" width="76" height="118" rx="6" fill="none" stroke="#FFB000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
  <line x1="37" y1="124" x2="37" y2="130" stroke="#FFB000" stroke-width="3" stroke-linecap="round"/>
  <line x1="93" y1="124" x2="93" y2="130" stroke="#FFB000" stroke-width="3" stroke-linecap="round"/>
  <rect x="34" y="14" width="62" height="21" rx="3" fill="none" stroke="#FFB000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
  <line x1="60" y1="21.5" x2="88" y2="21.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <line x1="60" y1="27.5" x2="80" y2="27.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <circle class="led" style="animation-delay:1.20s" cx="42" cy="24.5" r="2.8" fill="#3DDC84"/>
  <circle class="led" style="animation-delay:1.50s" cx="50" cy="24.5" r="2.8" fill="#5EEAD4"/>
  <rect x="34" y="41" width="62" height="21" rx="3" fill="none" stroke="#FFB000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
  <line x1="60" y1="48.5" x2="88" y2="48.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <line x1="60" y1="54.5" x2="80" y2="54.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <circle class="led" style="animation-delay:1.55s" cx="42" cy="51.5" r="2.8" fill="#3DDC84"/>
  <circle class="led" style="animation-delay:2.00s" cx="50" cy="51.5" r="2.8" fill="#5EEAD4"/>
  <rect x="34" y="68" width="62" height="21" rx="3" fill="none" stroke="#FFB000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
  <line x1="60" y1="75.5" x2="88" y2="75.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <line x1="60" y1="81.5" x2="80" y2="81.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <circle class="led" style="animation-delay:1.90s" cx="42" cy="78.5" r="2.8" fill="#FFB000"/>
  <circle class="led" style="animation-delay:2.50s" cx="50" cy="78.5" r="2.8" fill="#5EEAD4"/>
  <rect x="34" y="95" width="62" height="21" rx="3" fill="none" stroke="#FFB000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
  <line x1="60" y1="102.5" x2="88" y2="102.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <line x1="60" y1="108.5" x2="80" y2="108.5" stroke="#6B7685" stroke-width="2" stroke-linecap="round" pathLength="1"/>
  <circle class="led" style="animation-delay:2.25s" cx="42" cy="105.5" r="2.8" fill="#3DDC84"/>
  <circle class="led" style="animation-delay:3.00s" cx="50" cy="105.5" r="2.8" fill="#5EEAD4"/>
</g>

<g clip-path="url(#frame)" pointer-events="none">
  <rect width="900" height="210" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="900" height="140" fill="url(#sweepG)"/>
</g>
</svg>
