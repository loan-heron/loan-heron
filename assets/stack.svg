<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Stack : front, back, données, infra, IA et outils">
<title>Stack : front, back, données, infra, IA et outils</title>

<style>
  text{font-family:'JetBrains Mono','Fira Code','SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;white-space:pre}
  .in{animation:in .55s ease both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fade{animation:fade .8s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .cur{animation:cur 1.05s steps(1) infinite}
  @keyframes cur{50%{fill-opacity:0}}
  .led{animation:led 2.4s ease-in-out infinite}
  @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
  .draw{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.6,0,.2,1) both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .type{transform-box:fill-box;transform-origin:0 0;animation:type 1s steps(12,end) both}
  @keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite}
  @keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.8);opacity:0}}
  .sweep{animation:sweep 8s linear infinite}
  @keyframes sweep{from{transform:translateY(-140px)}to{transform:translateY(560px)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .breath{animation:breath 6s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.13}50%{opacity:.22}}
  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 1.1s ease-in-out infinite alternate}
  @keyframes bar{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#fff" opacity=".028"/></pattern>
  <linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFB000" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFB000" stop-opacity=".055"/>
    <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="moon" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#FFB000" stop-opacity="1"/>
    <stop offset=".7" stop-color="#FFB000" stop-opacity=".55"/>
    <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect x="1" y="1" width="898" height="358" rx="16"/></clipPath>
</defs>


<rect x="1" y="1" width="898" height="358" rx="16" fill="#0B0D10" stroke="#232A34" stroke-width="2"/>
<circle cx="26" cy="21" r="6" fill="#FF5F57"/>
<circle cx="46" cy="21" r="6" fill="#FFB000"/>
<circle cx="66" cy="21" r="6" fill="#3DDC84"/>
<text x="450" y="26" text-anchor="middle" font-size="13" fill="#6B7685">heron@homelab — systemctl list-units --type=competence</text>
<line x1="2" y1="42" x2="898" y2="42" stroke="#232A34" stroke-width="1.5"/>
<text x="56" y="76" font-size="11" letter-spacing="2" fill="#6B7685">UNITÉ</text>
<text x="232" y="76" font-size="11" letter-spacing="2" fill="#6B7685">ÉTAT</text>
<text x="310" y="76" font-size="11" letter-spacing="2" fill="#6B7685">MODULES</text>
<line x1="36" y1="90" x2="864" y2="90" stroke="#232A34" stroke-width="1.5"/>
<g class="in" style="animation-delay:0.30s">
  <circle class="led" style="animation-delay:0.00s" cx="40" cy="123" r="4.5" fill="#3DDC84"/>
  <text x="56" y="128" font-size="14" fill="#FFB000">front.service</text>
  <text x="232" y="128" font-size="14" fill="#3DDC84">actif</text>
  <text x="310" y="128" font-size="13.5" fill="#E6EAF0">HTML · CSS · JavaScript · TypeScript · React · Vite · GSAP</text>
</g>
<g class="in" style="animation-delay:0.45s">
  <circle class="led" style="animation-delay:0.40s" cx="40" cy="157" r="4.5" fill="#3DDC84"/>
  <text x="56" y="162" font-size="14" fill="#FFB000">back.service</text>
  <text x="232" y="162" font-size="14" fill="#3DDC84">actif</text>
  <text x="310" y="162" font-size="13.5" fill="#E6EAF0">Node.js · Express · Zod · JWT · bcrypt · Nodemailer</text>
</g>
<g class="in" style="animation-delay:0.60s">
  <circle class="led" style="animation-delay:0.80s" cx="40" cy="191" r="4.5" fill="#3DDC84"/>
  <text x="56" y="196" font-size="14" fill="#FFB000">data.service</text>
  <text x="232" y="196" font-size="14" fill="#3DDC84">actif</text>
  <text x="310" y="196" font-size="13.5" fill="#E6EAF0">MySQL · PostgreSQL · Supabase</text>
</g>
<g class="in" style="animation-delay:0.75s">
  <circle class="led" style="animation-delay:1.20s" cx="40" cy="225" r="4.5" fill="#3DDC84"/>
  <text x="56" y="230" font-size="14" fill="#FFB000">infra.service</text>
  <text x="232" y="230" font-size="14" fill="#3DDC84">actif</text>
  <text x="310" y="230" font-size="13.5" fill="#E6EAF0">Proxmox · LXC · Nginx Proxy Manager · Linux · Vercel</text>
</g>
<g class="in" style="animation-delay:0.90s">
  <circle class="led" style="animation-delay:1.60s" cx="40" cy="259" r="4.5" fill="#3DDC84"/>
  <text x="56" y="264" font-size="14" fill="#FFB000">ia.service</text>
  <text x="232" y="264" font-size="14" fill="#3DDC84">actif</text>
  <text x="310" y="264" font-size="13.5" fill="#E6EAF0">SDK Claude · prototypage assisté par IA</text>
</g>
<g class="in" style="animation-delay:1.05s">
  <circle class="led" style="animation-delay:2.00s" cx="40" cy="293" r="4.5" fill="#3DDC84"/>
  <text x="56" y="298" font-size="14" fill="#FFB000">outils.service</text>
  <text x="232" y="298" font-size="14" fill="#3DDC84">actif</text>
  <text x="310" y="298" font-size="13.5" fill="#E6EAF0">Git · GitHub · npm · Postman</text>
</g>
<line x1="36" y1="308" x2="864" y2="308" stroke="#232A34" stroke-width="1.5"/>
<text class="fade" style="animation-delay:1.40s" x="36" y="334" font-size="12" fill="#6B7685">6 unités chargées · <tspan fill="#3DDC84">0 en échec</tspan> · toujours en apprentissage</text>

<g clip-path="url(#frame)" pointer-events="none">
  <rect width="900" height="360" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="900" height="140" fill="url(#sweepG)"/>
</g>
</svg>
